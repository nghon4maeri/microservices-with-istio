apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  namespace: default
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 30000
    - name: metrics
      port: 8099
      targetPort: 8099
  type: ClusterIP